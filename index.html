        { path: "UI/references/ui-audit-checklist.md", title: "Checklist de Auditoría UI", category: "UI", kind: "REF", version: "-", lines: 64 },
        { path: "UI/examples/01-ui-component-refactor-before-after.md", title: "Ej. 01 — Refactor TSX/CSS UI", category: "UI", kind: "EXAMPLE", version: "-", lines: 328 },
        { path: "UI/examples/02-ui-audit-report-sample.md", title: "Ej. 02 — Auditoría UI Modelo", category: "UI", kind: "EXAMPLE", version: "-", lines: 78 },
      ]);

      const CATALOG_PATHS = new Set(CATALOG.map((item) => item.path));

      // Núcleo puro: filtrado, rutas y renderizado seguro
      function filterDocuments(docs, category, query) {
        const normalized = query.trim().toLowerCase();
        return docs.filter((doc) => {
          if (category !== "ALL" && doc.category !== category) return false;
          if (!normalized) return true;
          return (
            doc.title.toLowerCase().includes(normalized) ||
            doc.path.toLowerCase().includes(normalized) ||
            doc.kind.toLowerCase().includes(normalized)
          );
        });
      }

      function resolveRelativeDocPath(currentPath, href) {
        if (!href || /^(https?:|mailto:|#)/i.test(href)) return null;
        const cleanHref = href.split("#")[0];
        if (!cleanHref.endsWith(".md")) return null;
        const baseParts = currentPath.split("/").slice(0, -1);
        for (const segment of cleanHref.split("/")) {
          if (!segment || segment === ".") continue;
          if (segment === "..") baseParts.pop();
          else baseParts.push(segment);
        }
        const resolved = baseParts.join("/");
        return CATALOG_PATHS.has(resolved) ? resolved : null;
      }

      function escapeHtml(raw) {
        return raw
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function isSafeExternalUrl(url) {
        return /^https?:\/\//i.test(url);
      }

      function renderInline(raw, currentPath) {
        let out = escapeHtml(raw);
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
          const internal = resolveRelativeDocPath(currentPath, href);
          if (internal) {
            return `<a href="#doc=${encodeURIComponent(internal)}" data-doc-link="${escapeHtml(internal)}">${label}</a>`;
          }
          if (isSafeExternalUrl(href)) {
            return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
          }
          return label;
        });
        return out;
      }

      function splitFrontmatter(markdown) {
        const match = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
        if (!match) return { meta: "", body: markdown };
        return { meta: match[1], body: match[2] };
      }

      function renderMarkdownSafe(markdown, currentPath) {
        const { meta, body } = splitFrontmatter(markdown);
        const lines = body.replace(/\r\n/g, "\n").split("\n");
        const html = [];

        if (meta) {
          html.push(`<pre class="frontmatter-card"><code>${escapeHtml(meta)}</code></pre>`);
        }

        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) {
            i += 1;
            continue;
          }

          if (line.trim().startsWith("```")) {
            const codeLines = [];
            i += 1;
            while (i < lines.length && !lines[i].trim().startsWith("```")) {
              codeLines.push(lines[i]);
              i += 1;
            }
            i += 1;
            html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            // Baja 1 nivel para mantener un único h1 en el DOM
            const level = Math.min(heading[1].length + 1, 5);
            html.push(`<h${level}>${renderInline(heading[2], currentPath)}</h${level}>`);
            i += 1;
            continue;
          }

          if (/^---+$/.test(line.trim())) {
            i += 1;
            continue;
          }

          if (line.trim().startsWith(">")) {
            const quoteLines = [];
            while (i < lines.length && lines[i].trim().startsWith(">")) {
              quoteLines.push(lines[i].trim().replace(/^>\s?/, ""));
              i += 1;
            }
            html.push(`<blockquote>${renderInline(quoteLines.join(" "), currentPath)}</blockquote>`);
            continue;
          }

          if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1])) {
            const parseRow = (row) =>
              row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
            const headers = parseRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              rows.push(parseRow(lines[i]));
              i += 1;
            }
            const thead = `<thead><tr>${headers.map((h) => `<th>${renderInline(h, currentPath)}</th>`).join("")}</tr></thead>`;
            const tbody = `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${renderInline(c, currentPath)}</td>`).join("")}</tr>`).join("")}</tbody>`;
            html.push(`<div class="table-wrap"><table>${thead}${tbody}</table></div>`);
            continue;
          }

          if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
            const isOrdered = /^\s*\d+\.\s+/.test(line);
            const tag = isOrdered ? "ol" : "ul";
            const pattern = isOrdered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
            const items = [];
            while (i < lines.length && pattern.test(lines[i])) {
              items.push(`<li>${renderInline(lines[i].replace(pattern, ""), currentPath)}</li>`);
              i += 1;
            }
            html.push(`<${tag}>${items.join("")}</${tag}>`);
            continue;
          }

          const para = [];
          while (
            i < lines.length &&
            lines[i].trim() &&
            !/^(#{1,4}\s|```|>|\s*[-*]\s|\s*\d+\.\s|---+$)/.test(lines[i])
          ) {
            para.push(lines[i].trim());
            i += 1;
          }
          html.push(`<p>${renderInline(para.join(" "), currentPath)}</p>`);
        }

        return html.join("\n");
      }

      // Caché, deduplicación, timeout y cancelación
      function createMarkdownLoader(timeoutMs = 8000) {
        const cache = new Map();
        const inFlight = new Map();

        return {
          async load(path, externalSignal) {
            if (cache.has(path)) return cache.get(path);
            if (inFlight.has(path)) return inFlight.get(path);

            const request = (async () => {
              const signal = externalSignal
                ? AbortSignal.any([externalSignal, AbortSignal.timeout(timeoutMs)])
                : AbortSignal.timeout(timeoutMs);
              const response = await fetch(`./${path}`, { signal });
              if (!response.ok) {
                throw new Error(`HTTP_${response.status}`);
              }
              const text = await response.text();
              cache.set(path, text);
              return text;
            })().finally(() => {
              inFlight.delete(path);
            });

            inFlight.set(path, request);
            return request;
          },
        };
      }

      const loader = createMarkdownLoader();
      const state = {
        category: "ALL",
        query: "",
        activePath: "README.md",
        activeMarkdown: "",
      };

      let activeAbortController = null;
      let skeletonTimer = null;
      let searchDebounce = null;

      const els = {
        sidebar: document.getElementById("sidebar-drawer"),
        menuToggle: document.getElementById("menu-toggle"),
        counter: document.getElementById("doc-counter"),
        search: document.getElementById("doc-search"),
        filterButtons: Array.from(document.querySelectorAll(".filter-chip")),
        docList: document.getElementById("doc-list"),
        activeCategory: document.getElementById("active-category"),
        activePath: document.getElementById("active-path"),
        rawLink: document.getElementById("raw-link"),
        copyBtn: document.getElementById("copy-btn"),
        liveStatus: document.getElementById("live-status"),
        viewer: document.getElementById("doc-viewer"),
      };

      function setDrawerOpen(open) {
        els.sidebar.setAttribute("data-open", open ? "true" : "false");
        els.menuToggle.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) els.search.focus();
        else if (document.activeElement && els.sidebar.contains(document.activeElement)) {
          els.menuToggle.focus();
        }
      }

      function renderSidebarList() {
        const filtered = filterDocuments(CATALOG, state.category, state.query);
        els.counter.textContent = String(filtered.length);

        if (filtered.length === 0) {
          els.docList.innerHTML = `
            <div class="state-box">
              <p class="state-box__title">Sin coincidencias</p>
              <button type="button" id="clear-filters-btn" class="btn btn--secondary">Limpiar filtros</button>
            </div>
          `;
          document.getElementById("clear-filters-btn")?.addEventListener("click", () => {
            state.category = "ALL";
            state.query = "";
            els.search.value = "";
            els.filterButtons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.category === "ALL" ? "true" : "false"));
            renderSidebarList();
          });
          return;
        }

        els.docList.innerHTML = filtered
          .map((doc) => {
            const isCurrent = doc.path === state.activePath;
            const metaText = doc.version !== "-" ? `v${doc.version}` : `${doc.lines}L`;
            return `
              <button
                type="button"
                class="doc-item"
                data-doc-path="${escapeHtml(doc.path)}"
                aria-current="${isCurrent ? "page" : "false"}"
                aria-label="Abrir ${escapeHtml(doc.title)} (${escapeHtml(doc.path)})"
              >
                <span class="doc-item__top">
                  <span class="doc-item__title">${escapeHtml(doc.title)}</span>
                  <span class="doc-item__meta">${metaText}</span>
                </span>
                <span class="doc-item__path">${escapeHtml(doc.path)}</span>
              </button>
            `;
          })
          .join("");
      }

      function renderSkeleton() {
        els.viewer.innerHTML = `
          <div class="skeleton" aria-label="Cargando documento">
            <div class="skeleton__bar skeleton__bar--title"></div>
            <div class="skeleton__bar"></div>
            <div class="skeleton__bar"></div>
            <div class="skeleton__bar skeleton__bar--short"></div>
          </div>
        `;
      }

      function renderLoadError(path, err) {
        const isFileProtocol = window.location.protocol === "file:";
        const detail = isFileProtocol
          ? "Los navegadores bloquean fetch() sobre file://. Ejecuta un servidor estático local (por ejemplo: python3 -m http.server 8080) o abre el archivo .md directamente."
          : `No se pudo leer ${path} (${err instanceof Error ? err.message : "Error de red"}).`;

        els.viewer.innerHTML = `
          <div class="state-box state-box--error" role="alert">
            <h2 class="state-box__title">No se pudo cargar el documento</h2>
            <p>${escapeHtml(detail)}</p>
            <div class="state-box__actions">
              <button type="button" id="retry-load-btn" class="btn btn--secondary">Reintentar</button>
              <a class="btn btn--primary" href="./${escapeHtml(path)}">Abrir ${escapeHtml(path)}</a>
            </div>
          </div>
        `;
        document.getElementById("retry-load-btn")?.addEventListener("click", () => selectDocument(path));
      }

      async function selectDocument(path) {
        if (!CATALOG_PATHS.has(path)) return;
        const entry = CATALOG.find((d) => d.path === path);
        state.activePath = path;
        state.activeMarkdown = "";

        els.activeCategory.textContent = entry.category;
        els.activeCategory.setAttribute("data-cat", entry.category);
        els.activePath.textContent = path;
        els.rawLink.setAttribute("href", `./${path}`);
        els.copyBtn.disabled = true;
        window.history.replaceState(null, "", `#doc=${encodeURIComponent(path)}`);
        renderSidebarList();
        setDrawerOpen(false);

        activeAbortController?.abort();
        activeAbortController = new AbortController();
        clearTimeout(skeletonTimer);
        els.viewer.setAttribute("aria-busy", "true");

        // Retraso 150ms evita parpadeo en respuestas desde caché
        skeletonTimer = setTimeout(renderSkeleton, 150);

        try {
          const markdown = await loader.load(path, activeAbortController.signal);
          clearTimeout(skeletonTimer);
          state.activeMarkdown = markdown;
          els.viewer.innerHTML = `<div class="prose">${renderMarkdownSafe(markdown, path)}</div>`;
          els.copyBtn.disabled = false;
          els.liveStatus.textContent = `Documento cargado: ${entry.title}`;
        } catch (err) {
          clearTimeout(skeletonTimer);
          if (err instanceof Error && err.name === "AbortError") return;
          renderLoadError(path, err);
        } finally {
          els.viewer.setAttribute("aria-busy", "false");
        }
      }

      els.filterButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.category || "ALL";
          els.filterButtons.forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
          renderSidebarList();
        });
      });

      els.search.addEventListener("input", () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          state.query = els.search.value;
          renderSidebarList();
        }, 250);
      });

      els.docList.addEventListener("click", (event) => {
        const button = event.target instanceof Element ? event.target.closest("[data-doc-path]") : null;
        if (button instanceof HTMLElement && button.dataset.docPath) {
          void selectDocument(button.dataset.docPath);
        }
      });

      els.viewer.addEventListener("click", (event) => {
        const link = event.target instanceof Element ? event.target.closest("[data-doc-link]") : null;
        if (link instanceof HTMLElement && link.dataset.docLink) {
          event.preventDefault();
          void selectDocument(link.dataset.docLink);
        }
      });

      els.copyBtn.addEventListener("click", async () => {
        if (!state.activeMarkdown) return;
        const original = els.copyBtn.textContent;
        els.copyBtn.disabled = true;
        try {
          await navigator.clipboard.writeText(state.activeMarkdown);
          els.copyBtn.textContent = "Copiado";
          els.liveStatus.textContent = "Markdown copiado al portapapeles";
        } catch {
          els.copyBtn.textContent = "Error al copiar";
        } finally {
          setTimeout(() => {
            els.copyBtn.textContent = original;
            els.copyBtn.disabled = false;
          }, 1200);
        }
      });

      els.menuToggle.addEventListener("click", () => {
        const isOpen = els.sidebar.getAttribute("data-open") === "true";
        setDrawerOpen(!isOpen);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && els.sidebar.getAttribute("data-open") === "true") {
          setDrawerOpen(false);
        }
      });

      const hashMatch = window.location.hash.match(/^#doc=(.+)$/);
      const initialPath = hashMatch ? decodeURIComponent(hashMatch[1]) : "README.md";
      void selectDocument(CATALOG_PATHS.has(initialPath) ? initialPath : "README.md");
    </script>
  </body>
</html>
